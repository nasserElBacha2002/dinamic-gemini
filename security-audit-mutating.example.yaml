# security-audit-mutating.example.yaml — dinamic-gemini
# LEGACY upload/DELETE candidates. Prefer the mutating-client-creates suite in
# security-audit.yaml (POST /api/v3/clients + http_custom_endpoint cleanup).
# Do NOT enable against shared/real data. Requires DAST_MUTATING_CONFIRMATION.
# Review each case before execution (executable gated by cleanup + allowlists).

schema_version: "1.2.0"
framework_version: "0.3.0"

project:
  name: "dinamic-gemini-mutating-example"
  description: "Example mutating DAST candidates derived from real upload/DELETE routes."

# Inherit non-mutating config pattern; only documenting candidate mutating suites.
dast:
  environment: local
  appears_production: false
  base_url_env: DAST_BASE_URL
  target_policy:
    allowed_hosts: ["127.0.0.1", "localhost"]
    follow_redirects: false
    allow_public_networks: false
  active:
    explicit_authorization: true
    allow_active: false  # keep false until fixture DB + cleanup verified
    require_run_confirmation: true
    run_confirmation_env: DAST_ACTIVE_CONFIRMATION
    suites:
      - id: upload-candidates-review-required
        enabled: false
        cases:
          - id: mut-upload-supplier-reference-images
            description: "REVIEW_REQUIRED mutating candidate — upload_supplier_reference_images"
            category: file_upload
            method: POST
            path: "/api/v3/clients/11111111-1111-4111-8111-111111111111/suppliers/55555555-5555-4555-8555-555555555555/reference-images"
            mutating: true
            cleanup_strategy: http_delete_fixture
            auth_profile: platform_admin_test
            expected_statuses: [200, 201, 204, 400, 403, 404, 422]
            tags:
              - "source:backend/src/api/routes/v3/clients.py"
              - "handler:upload_supplier_reference_images"
              - review_required
              - executable_false_until_cleanup_ready
          - id: mut-upload-aisle-assets
            description: "REVIEW_REQUIRED mutating candidate — upload_aisle_assets"
            category: file_upload
            method: POST
            path: "/api/v3/inventories/33333333-3333-4333-8333-333333333333/aisles/44444444-4444-4444-8444-444444444444/assets"
            mutating: true
            cleanup_strategy: http_delete_fixture
            auth_profile: platform_admin_test
            expected_statuses: [200, 201, 204, 400, 403, 404, 422]
            tags:
              - "source:backend/src/api/routes/v3/assets.py"
              - "handler:upload_aisle_assets"
              - review_required
              - executable_false_until_cleanup_ready
          - id: mut-preview-local-csv-import
            description: "REVIEW_REQUIRED mutating candidate — preview_local_csv_import"
            category: file_upload
            method: POST
            path: "/api/v3/inventories/33333333-3333-4333-8333-333333333333/local-csv-imports/preview"
            mutating: true
            cleanup_strategy: http_delete_fixture
            auth_profile: platform_admin_test
            expected_statuses: [200, 201, 204, 400, 403, 404, 422]
            tags:
              - "source:backend/src/api/routes/v3/local_csv_imports.py"
              - "handler:preview_local_csv_import"
              - review_required
              - executable_false_until_cleanup_ready
          - id: mut-delete-supplier-reference-image
            description: "REVIEW_REQUIRED mutating candidate — delete_supplier_reference_image"
            category: destructive
            method: DELETE
            path: "/api/v3/clients/11111111-1111-4111-8111-111111111111/suppliers/55555555-5555-4555-8555-555555555555/reference-images/66666666-6666-4666-8666-666666666666"
            mutating: true
            cleanup_strategy: http_delete_fixture
            auth_profile: platform_admin_test
            expected_statuses: [200, 201, 204, 400, 403, 404, 422]
            tags:
              - "source:backend/src/api/routes/v3/clients.py"
              - "handler:delete_supplier_reference_image"
              - review_required
              - executable_false_until_cleanup_ready
          - id: mut-delete-aisle-source-asset
            description: "REVIEW_REQUIRED mutating candidate — delete_aisle_source_asset"
            category: destructive
            method: DELETE
            path: "/api/v3/inventories/33333333-3333-4333-8333-333333333333/aisles/44444444-4444-4444-8444-444444444444/assets/77777777-7777-4777-8777-777777777777"
            mutating: true
            cleanup_strategy: http_delete_fixture
            auth_profile: platform_admin_test
            expected_statuses: [200, 201, 204, 400, 403, 404, 422]
            tags:
              - "source:backend/src/api/routes/v3/assets.py"
              - "handler:delete_aisle_source_asset"
              - review_required
              - executable_false_until_cleanup_ready
  destructive_routes:
    reviewed: true
    deny:
      - method: DELETE
        path: "/**"
    allow: []  # explicitly empty until fixture allowlist reviewed
  cleanup:
    defined: true
    adapter: http_delete_fixture
    notes: "Only enable after disposable fixture resources and verified DELETE cleanup."
  test_data_strategy:
    defined: true
    notes: "Synthetic uploads only (empty/incorrect MIME/traversal filename). No malware."
  authentication:
    enabled: true
    profiles:
      - name: platform_admin_test
        type: bearer
        token_env: DAST_TOKEN_PLATFORM_ADMIN
context:
  notes: "Mutating example only. SSRF still N/A. Rate-limit login tests can be added here with low caps."
