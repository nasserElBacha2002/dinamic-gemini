  authentication:
    enabled: true
    profiles:
      - name: platform_admin_test
        type: bearer
        token_env: DAST_TOKEN_PLATFORM_ADMIN
      - name: company_admin_a
        type: bearer
        token_env: DAST_TOKEN_COMPANY_ADMIN_A
      - name: company_admin_b
        type: bearer
        token_env: DAST_TOKEN_COMPANY_ADMIN_B
      - name: operator_a
        type: bearer
        token_env: DAST_TOKEN_OPERATOR_A
      - name: operator_b
        type: bearer
        token_env: DAST_TOKEN_OPERATOR_B
      - name: invalid_token
        type: bearer
        token_env: DAST_TOKEN_INVALID

  test_profiles:
    - name: anonymous
      auth_profile: null
    - name: platform_admin
      auth_profile: platform_admin_test
    - name: company_admin_a
      auth_profile: company_admin_a
    - name: company_admin_b
      auth_profile: company_admin_b
    - name: operator_a
      auth_profile: operator_a
    - name: operator_b
      auth_profile: operator_b

  authorization:
    enabled: true
    explicit_authorization: true

  authorization_tests:
    - id: authz-client-b-as-admin-a
      description: company_admin_a must not access client_b
      auth_profile: company_admin_a
      method: GET
      path: /api/v3/clients/22222222-2222-4222-8222-222222222222
      expect_forbidden: true
      expect_status: 403
    - id: authz-client-a-as-admin-b
      description: company_admin_b must not access client_a
      auth_profile: company_admin_b
      method: GET
      path: /api/v3/clients/11111111-1111-4111-8111-111111111111
      expect_forbidden: true
      expect_status: 403
    - id: authz-inventory-a-as-admin-b
      description: cross-tenant inventory read denied
      auth_profile: company_admin_b
      method: GET
      path: /api/v3/inventories/33333333-3333-4333-8333-333333333333
      expect_forbidden: true
      expect_status: 403
    - id: authz-admin-ai-as-operator
      description: operator denied admin AI config
      auth_profile: operator_a
      method: GET
      path: /api/v3/admin/ai-config
      expect_forbidden: true
      expect_status: 403

  rate_limit:
    requests_per_second: 1
    max_concurrent: 1
    max_requests: 200
    max_response_bytes: 1048576
    max_request_bytes: 262144
    request_timeout_seconds: 10

  destructive_routes:
    reviewed: true
    deny:
      - method: DELETE
        path: "/**"
      - method: POST
        path: "/**"
      - method: PUT
        path: "/**"
      - method: PATCH
        path: "/**"
    allow: []

  test_data_strategy:
    defined: true
    notes: "Synthetic local users/tokens via env. Synthetic UUIDs in audit/dast-gemini-config. No real PII. Non-mutating only."

  cleanup:
    defined: true
    adapter: noop_non_mutating
    notes: "Initial dinamic-gemini DAST config is non-mutating; no cleanup traffic."

  external_side_effects:
    block_public_networks: true
    block_redirects: true

  multi_tenancy:
    enabled: true
    isolation_tests_required: true

remediation:
  authorized: false

reporting:
  include_informational: true
  export_bundle: true
  retain_raw_outputs: true
  redact_raw_outputs: true
  export_raw_outputs: false

context:
  compliance_drivers: []
  notes: >
    Project-specific DAST from real FastAPI routes. /public removed (does not exist).
    SSRF/open-redirect suites omitted (no matching surface). Uploads/mutations in
    security-audit-mutating.example.yaml only. ZAP Baseline optional (disabled).
    ACTIVE_SCANNER not_implemented. Roles in JWT: platform_admin|company_admin|operator.
