# security-audit.yaml — dinamic-gemini (project-specific, non-mutating DAST)
# Generated from static FastAPI inventory. NO invented routes.
# NEVER put real secrets/tokens in this file — env var names only.
#
# Prerequisites for path-scoped suites (IDOR / tenant / some SQLi):
#   Seed a disposable local DB with synthetic IDs documented in
#   audit/dast-gemini-config/endpoint-inventory.md
#   Or those cases may return 404 (still useful for authz fail-closed checks).
#
# estimated_requests (declarative suites only): 102
# OpenAPI safe GET generation may add more at plan time when /openapi.json is available.

schema_version: "1.2.0"
framework_version: "0.3.0"

project:
  name: "dinamic-gemini"
  description: "Inventory Engine API — FastAPI/SQL Server; project-specific DAST suites from real routes."

paths:
  include:
    - "."
  exclude:
    - "**/.git/**"
    - "**/node_modules/**"
    - "**/vendor/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/.venv/**"
    - "**/venv/**"
    - "**/env/**"
    - "**/__pycache__/**"
    - "**/.pytest_cache/**"
    - "**/.mypy_cache/**"
    - "**/.ruff_cache/**"
    - "**/.expo/**"
    - "**/coverage/**"
    - "**/htmlcov/**"
    - "**/security-audit-output/**"
    - "**/audit-out/**"
    - "**/audit/implementation/**"
    - "**/audit/dast-gemini-config/**"
    - "**/uploads/**"
    - "**/media/**"
    - "**/output/**"
    - "**/output_test_artifacts/**"
    - "**/.tmp/**"
    - "**/secrets/**"

output_dir: "security-audit-output"

sast:
  candidates:
    semgrep:
      enabled: true
      rules_path: null
    gitleaks:
      enabled: true
      scan_workspace: true
      scan_git_history: false
    trivy:
      enabled: true
    osv_scanner:
      enabled: true
    npm_audit:
      enabled: true
    language_specific:
      enabled: true
  tool_installation:
    mode: detect_only
  network_policy:
    allow_rule_downloads: false
  codeql:
    enabled: true
    mode: detect_only
    required: false
  timeouts:
    default_seconds: 600

dast:
  environment: local
  appears_production: false
  base_url_env: DAST_BASE_URL

  target_policy:
    allowed_hosts:
      - "127.0.0.1"
      - "localhost"
    denied_hosts: []
    denied_host_patterns:
      - "*prod*"
      - "*production*"
      - "*live*"
    follow_redirects: false
    allow_private_networks: false
    allow_public_networks: false

  production_override:
    allowed: false
    confirmation_phrase_env: null

  openapi:
    path: "/openapi.json"
    discovery_enabled: true
    generate_safe_cases: true

  scanners:
    zap_baseline:
      enabled: false
      mode: docker
      max_duration_seconds: 600
      spider_minutes: 1
      ajax_spider: false
      fail_on:
        - high
      rules_file: null

  passive:
    enabled: true
    explicit_authorization: true

  active:
    explicit_authorization: true
    allow_active: true
    require_run_confirmation: true
    run_confirmation_env: DAST_ACTIVE_CONFIRMATION

    injection_tests:
      enabled: true
      explicit_authorization: true
      confirmation_env: DAST_INJECTION_CONFIRMATION
      safe_payloads_only: true
      allow_destructive_payloads: false
      allow_external_callbacks: false

    cases: []

    suites:
      - id: health-and-ready
        enabled: true
        cases:
          - id: health-get
            description: Liveness probe from server.py health()
            category: smoke
            method: GET
            path: /health
            query: {}
            headers: {}
            auth_profile: null
            expected_statuses:
              - 200
            mutating: false
            cleanup_strategy: null
            tags:
              - "source:backend/src/api/server.py"
              - "handler:health"
            assertions:
              no_5xx: true
              no_stack_trace: true
            reflection_probe:
              enabled: false
          - id: ready-get
            description: Readiness probe from server.py ready()
            category: smoke
            method: GET
            path: /ready
            query: {}
            headers: {}
            auth_profile: null
            expected_statuses:
              - 200
              - 503
            mutating: false
            cleanup_strategy: null
            tags:
              - "source:backend/src/api/server.py"
              - "handler:ready"
            assertions:
              no_5xx: true
              no_stack_trace: true
            reflection_probe:
              enabled: false
