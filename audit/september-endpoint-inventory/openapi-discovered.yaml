    SourceAssetImageDisplayUrlResponse:
      properties:
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
          description: HTTPS presigned URL when strategy is presigned_url; null when
            client must use /file.
        requires_authenticated_fetch:
          type: boolean
          title: Requires Authenticated Fetch
          description: True iff the client must GET .../file with Bearer and display
            the response body (or follow redirect for non-image flows).
          default: false
        display_strategy:
          type: string
          enum:
          - presigned_url
          - authenticated_file_fetch
          title: Display Strategy
          description: 'presigned_url: set image_url. authenticated_file_fetch: GET
            the sibling /file route (local/legacy bytes, HEIC normalized preview,
            or other /file behavior).'
      type: object
      required:
      - display_strategy
      title: SourceAssetImageDisplayUrlResponse
      description: "JSON contract for SPA image display (avoids reading redirect ``Location``\
        \ from fetch).\n\n**display_strategy** makes the client contract explicit:\n\
        \n- ``presigned_url``: use ``image_url`` in ``<img src>`` without ``Authorization``.\n\
        - ``authenticated_file_fetch``: perform an authenticated ``GET`` on the **same**\
        \ asset's\n  ``.../file`` URL (this repo's evidence/reference file route).\
        \ That endpoint may return:\n\n    - Raw bytes for **local** or **legacy**\
        \ objects under ``v3_uploads``,\n    - A **307 redirect** to S3 when storage\
        \ is **S3** (not used by the HEIC branch),\n    - For **HEIC/HEIF**, a **normalized\
        \ JPEG** ``FileResponse`` when a preview exists.\n\n  The JSON endpoint only\
        \ returns this strategy after **non-HEIC** local/legacy paths pass the\n \
        \ same on-disk checks as ``/file`` would; HEIC returns this strategy only\
        \ when a normalized\n  preview path was found. A follow-up ``/file`` can still\
        \ fail if the file disappears between\n  calls (rare); treat errors like any\
        \ other ``/file`` response.\n\n``requires_authenticated_fetch`` is ``True``\
        \ iff ``display_strategy == authenticated_file_fetch``."
