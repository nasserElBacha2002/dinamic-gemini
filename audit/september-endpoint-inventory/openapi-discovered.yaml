          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventoryRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-audit-evidence: VERIFIED
      x-dast-priority: MEDIUM
      x-operational-risk: MEDIUM
      x-source-file: backend/src/api/routes/v3/inventories.py
      x-source-line: 111
      x-endpoint-id: EP-0056
      x-bola-status: AUTHORIZATION_UNKNOWN
      x-auth-required: true
    get:
      tags:
      - inventories-v3
      summary: List Inventories
      description: 'Inventories table: aggregates per row with search, filter, sort,
        and pagination (Sprint 1.4).


        **Contract:** returns a **paginated object** (`items`, `page`, `page_size`,
        `total_items`,

        `total_pages`), not a JSON array. This is an intentional breaking change from
        the pre–1.4 array body.'
      operationId: list_inventories_api_v3_inventories__get
      parameters:
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Case-insensitive substring on inventory name.
          title: Search
        description: Case-insensitive substring on inventory name.
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Exact inventory status (wire value, e.g. draft).
          title: Status
        description: Exact inventory status (wire value, e.g. draft).
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          description: name | created_at | updated_at | status | last_activity_at
            | pending_review_count | aisles_count
          default: created_at
          title: Sort By
        description: name | created_at | updated_at | status | last_activity_at |
          pending_review_count | aisles_count
      - name: sort_dir
        in: query
        required: false
        schema:
          type: string
          description: asc | desc
          default: desc
          title: Sort Dir
        description: asc | desc
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 25
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInventoryListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-audit-evidence: VERIFIED
      x-dast-priority: CRITICAL
      x-operational-risk: CRITICAL
      x-source-file: backend/src/api/routes/v3/inventories.py
      x-source-line: 190
      x-endpoint-id: EP-0055
