      description: 'Response for GET .../aisles/{aisle_id}/positions (Aisle Results).


        **Consolidation vs pagination:** filters apply to **raw** rows; ``page`` /
        ``page_size`` /

        ``sort_by`` / ``sort_dir`` apply **after** SKU consolidation within the raw
        rows the server

        loaded.


        **Truncation:** the server loads at most ``V3_POSITIONS_AISLE_RAW_CAP`` raw
        rows before

        consolidating. When ``raw_fetch_truncated`` is ``true``, more raw rows likely
        exist in the

        aisle than were loaded. In that case ``total_items`` and ``total_pages`` count
        **only**

        consolidated rows built from that loaded window — they are **not** guaranteed
        to match the

        full aisle. UIs must not treat them as globally exact totals; prefer showing
        a warning or

        disabling “last page” semantics when ``raw_fetch_truncated`` is true until
        a future true-count

        or streaming strategy exists.'
