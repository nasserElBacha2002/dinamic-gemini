          anyOf:
          - type: string
          - type: 'null'
          title: Provider Name
          description: Pipeline provider key (gemini, openai, claude, deepseek). Omit
            or null to use the server default (settings.llm_provider) without proactive
            credential validation.
        model_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Name
          description: Model id from processing-provider-options for the selected
            provider; omit for provider default.
        prompt_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt Key
          description: 'Ignored for hybrid body selection: new aisle jobs always use
            profile global_v22 (label-first). Listed keys (global_v21, global_v21_b,
            global_v22) remain valid for admin/options; HYBRID_PROMPT affects documentation
            and non-pipeline defaults only.'
        idempotency_key:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Idempotency Key
          description: Client idempotency key for process start. Replays return the
            existing job id when the same key was used for this aisle (including completed
            jobs within recent history).
        identification_mode:
          anyOf:
          - type: string
            enum:
            - CODE_SCAN
            - INTERNAL_OCR
            - LEGACY_LLM
          - type: 'null'
          title: Identification Mode
          description: Optional job-only override for aisle identification mode. Does
            not permanently change aisle/inventory/client config. Omit to resolve
            Request→Aisle→Inventory→Client→SYSTEM_DEFAULT.
        processing_mode:
          anyOf:
          - type: string
            enum:
            - AUTO
            - CODE_SCAN_ONLY
            - VISION_ONLY
          - type: 'null'
          title: Processing Mode
          description: 'Optional job-only dispatch policy: AUTO (CODE_SCAN then Vision
            when eligible), CODE_SCAN_ONLY (never Vision), VISION_ONLY (Vision only,
            skip CODE_SCAN). Omit for AUTO (backward compatible).'
      type: object
      title: ProcessAisleRequest
      description: Optional body for POST .../aisles/{aisle_id}/process (Phase 5).
