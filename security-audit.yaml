            expected_statuses:
              - 200
              - 201
            forbidden_statuses:
              - 401
              - 403
              - 500
            mutating: true
            cleanup_strategy: http_custom_endpoint
            tags:
              - "source:backend/src/api/routes/v3/clients.py"
              - "handler:create_client"
              - "mutating_lifecycle:company_admin_create_allowed"
            assertions:
              no_5xx: true
              no_stack_trace: true
              no_sql_error: true
            reflection_probe:
              enabled: false
          - id: create-client-anonymous-denied
            description: Anonymous create must be denied
            category: mutation
            method: POST
            path: /api/v3/clients/
            query: {}
            headers: {}
            auth_profile: null
