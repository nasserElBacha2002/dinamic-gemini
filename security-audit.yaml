      # ---------------------------------------------------------------------
      # Mutating suite — synthetic clients on disposable local DB only.
      # Entity: POST/PATCH /api/v3/clients (CreateClientRequest / UpdateClientRequest).
      # No LLM, uploads, jobs, WhatsApp, or inventory processing.
      # Successful creates must return JSON {"id": "<uuid>"} for identity tracking.
      # ---------------------------------------------------------------------
      - id: mutating-client-creates
        enabled: true
        cases:
          - id: create-client-valid
            description: Create synthetic DAST client (baseline mutating create)
            category: mutation
            method: POST
            path: /api/v3/clients/
            query: {}
            headers: {}
            auth_profile: platform_admin_test
            body:
              name: "DAST-MUTATING-CLIENT-BASELINE"
              status: "active"
            content_type: application/json
            expected_statuses:
              - 200
              - 201
            forbidden_statuses:
              - 500
            mutating: true
            cleanup_strategy: http_custom_endpoint
            tags:
              - "source:backend/src/api/routes/v3/clients.py"
              - "handler:create_client"
              - "mutating_lifecycle:create"
            assertions:
              no_5xx: true
              no_stack_trace: true
              no_sql_error: true
            reflection_probe:
              enabled: false
          - id: create-client-repeat-same-name
            description: >
              Second create with the same name. CreateClientUseCase has no uniqueness
              constraint — expect another successful create (new id), not 409.
            category: mutation
            method: POST
            path: /api/v3/clients/
            query: {}
            headers: {}
            auth_profile: platform_admin_test
            body:
              name: "DAST-MUTATING-CLIENT-BASELINE"
              status: "active"
            content_type: application/json
            expected_statuses:
              - 200
              - 201
            forbidden_statuses:
              - 500
            mutating: true
            cleanup_strategy: http_custom_endpoint
            tags:
              - "source:backend/src/api/routes/v3/clients.py"
              - "handler:create_client"
              - "mutating_lifecycle:repeat_create_no_uniqueness"
            assertions:
              no_5xx: true
              no_stack_trace: true
              no_sql_error: true
            reflection_probe:
              enabled: false
          - id: create-client-invalid-json
            description: >
              Malformed JSON body must not 500. body is a YAML string; encode_body()
              sends str as raw UTF-8 bytes (not json.dumps), so the wire body is
              literally {not-valid-json — confirmed against security-agents 0.3.0.
            category: mutation
            method: POST
            path: /api/v3/clients/
            query: {}
            headers: {}
            auth_profile: platform_admin_test
            body: "{not-valid-json"
            content_type: application/json
            expected_statuses:
              - 400
              - 422
            forbidden_statuses:
              - 200
              - 201
              - 500
            mutating: true
            cleanup_strategy: http_custom_endpoint
            tags:
              - "source:backend/src/api/routes/v3/clients.py"
              - "handler:create_client"
              - "mutating_lifecycle:invalid_json"
            assertions:
              no_5xx: true
              no_stack_trace: true
              no_sql_error: true
            reflection_probe:
              enabled: false
          - id: create-client-missing-name
            description: Missing required name property
            category: mutation
            method: POST
            path: /api/v3/clients/
            query: {}
            headers: {}
            auth_profile: platform_admin_test
            body: {}
            content_type: application/json
            expected_statuses:
              - 400
              - 422
            forbidden_statuses:
              - 200
              - 201
              - 500
            mutating: true
            cleanup_strategy: http_custom_endpoint
            tags:
              - "source:backend/src/api/routes/v3/clients.py"
              - "handler:create_client"
              - "mutating_lifecycle:missing_required"
            assertions:
              no_5xx: true
              no_stack_trace: true
              no_sql_error: true
            reflection_probe:
              enabled: false
          - id: create-client-wrong-type-name
            description: Wrong type for name (number instead of string)
            category: mutation
            method: POST
            path: /api/v3/clients/
            query: {}
            headers: {}
            auth_profile: platform_admin_test
            body:
              name: 1234
            content_type: application/json
            expected_statuses:
              - 400
              - 422
            forbidden_statuses:
              - 200
              - 201
              - 500
            mutating: true
            cleanup_strategy: http_custom_endpoint
            tags:
              - "source:backend/src/api/routes/v3/clients.py"
              - "handler:create_client"
              - "mutating_lifecycle:wrong_type"
            assertions:
              no_5xx: true
              no_stack_trace: true
              no_sql_error: true
            reflection_probe:
              enabled: false
          - id: create-client-mass-assignment
            description: >
              LIMITED: CreateClientRequest only accepts name/status (extra fields
              ignored by Pydantic). This case only asserts create still succeeds
              without 5xx. Full mass-assignment proof needs GET read-back of the
              created id (blocked until case extract/use exists) — do not treat a
              bare 201 as evidence that privileged fields were rejected.
            category: mutation
            method: POST
            path: /api/v3/clients/
            query: {}
            headers: {}
            auth_profile: platform_admin_test
            body:
              name: "DAST-MUTATING-CLIENT-MASS-ASSIGN"
              status: "active"
              role: "platform_admin"
              company_id: "22222222-2222-4222-8222-222222222222"
              tenant_id: "22222222-2222-4222-8222-222222222222"
              is_admin: true
              client_id: "22222222-2222-4222-8222-222222222222"
            content_type: application/json
            expected_statuses:
              - 200
              - 201
            forbidden_statuses:
              - 500
            mutating: true
            cleanup_strategy: http_custom_endpoint
            tags:
              - "source:backend/src/api/routes/v3/clients.py"
              - "handler:create_client"
              - "mutating_lifecycle:mass_assignment_limited"
              - "blocked:needs_readback_extract"
            assertions:
              no_5xx: true
              no_stack_trace: true
              no_sql_error: true
            reflection_probe:
              enabled: false
          - id: create-client-as-company-admin-a
            description: >
              Contract from code: clients router Depends(get_current_admin) allows
              company_admin with tenant binding — create must succeed (not authz deny).
            category: mutation
            method: POST
            path: /api/v3/clients/
            query: {}
