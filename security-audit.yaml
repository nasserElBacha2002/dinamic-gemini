      auth_profile: operator_a
      method: GET
      path: /api/v3/admin/ai-config
      expect_forbidden: true
      expect_status: 403

  rate_limit:
    requests_per_second: 1
    max_concurrent: 1
    max_requests: 120
    max_response_bytes: 1048576
    max_request_bytes: 262144
    request_timeout_seconds: 10

  # Deny beats allow in security-agents. Do not combine POST/** deny with POST allows.
  # Unapproved mutating surfaces are denied by tree; approved client create/patch allowlisted.
  destructive_routes:
    reviewed: true
    deny:
      - method: PUT
        path: "/**"
      - method: DELETE
        path: "/**"
      - method: POST
        path: "/api/v3/inventories/**"
      - method: POST
        path: "/api/v3/admin/**"
      - method: POST
        path: "/api/v3/analytics/**"
      - method: POST
        path: "/api/v3/review-queue/**"
      - method: POST
        path: "/api/v3/observability/**"
      - method: POST
        path: "/api/v3/config/**"
      - method: PATCH
        path: "/api/v3/inventories/**"
      - method: PATCH
        path: "/api/v3/admin/**"
      - method: PATCH
        path: "/api/v3/analytics/**"
      - method: PATCH
        path: "/api/v3/review-queue/**"
      - method: PATCH
        path: "/api/v3/observability/**"
      - method: PATCH
        path: "/api/v3/config/**"
    allow:
      - method: POST
        path: "/api/v3/clients"
      - method: POST
        path: "/api/v3/clients/"
      - method: PATCH
        path: "/api/v3/clients/*"
      - method: POST
        path: "/internal/dast/cleanup"

  test_data_strategy:
    defined: true
    notes: >
      Disposable local database only. Synthetic users, inventories, clients,
      aisles and related resources. Mutating DAST may create/update/delete only
      resources created for the current audit_run_id. No real PII or production data.

  cleanup:
    defined: true
    adapter: http_custom_endpoint
    endpoint_path: /internal/dast/cleanup
    auth_profile: platform_admin_test
    expected_statuses:
      - 200
    notes: >
      Clients have no product DELETE. Cleanup must call a local-only DAST endpoint
      that deletes only resources created by this audit_run_id and returns
      {ok:true, audit_run_id, remaining:0, resources_remaining:[]}.
      Do not run mutating active until that endpoint is implemented and verified
      against a disposable DB. http_delete_fixture is unsuitable until a hard
      DELETE exists for the mutated entity.

  external_side_effects:
    block_public_networks: true
    block_redirects: true

  multi_tenancy:
    enabled: true
    isolation_tests_required: true

remediation:
  authorized: false

reporting:
  include_informational: true
  export_bundle: true
  retain_raw_outputs: true
  redact_raw_outputs: true
  export_raw_outputs: false

context:
  compliance_drivers: []
  notes: >
    Project-specific DAST from real FastAPI routes. Non-mutating GET suites kept;
    mutating suite mutating-client-creates targets POST /api/v3/clients only.
    Injection remains GET/query only (no POST SQLi). Uploads/jobs/LLM/processing
    stay out of scope. ZAP Baseline optional (disabled). ACTIVE_SCANNER
    not_implemented. Roles in JWT: platform_admin|company_admin|operator.

    BLOCKERS before a real mutating active run (still NOT ready for dast active mutant):
    1) Implement /internal/dast/cleanup for disposable local env and verify
       remaining=0 after creates.
    2) Add active.mutating_tests confirmation gate in security-agents
       (confirmation_env: DAST_MUTATING_CONFIRMATION = CONFIRM_MUTATING_DAST_<RUN_ID>)
       and block all POST/PUT/PATCH/DELETE when missing/mismatched.
    3) Add case extract/use so GET read-back / PATCH / cross-tenant probes can
       reuse created ids (do not invent fixed mutation IDs). Mass-assignment
       remains limited without that read-back.
    4) Confirm API DB is disposable/synthetic — localhost alone is not enough.
    5) Pass P0 per-request create tracking test
       (baseline+probe creates both cleaned up).
